[package]
name = "affected"
version = "0.1.0"
edition = "2021"
description = "Given a git diff, which projects in this monorepo actually changed — for CI to build/test only what changed"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/affected"
readme = "README.md"
keywords = ["monorepo", "ci", "git", "nx", "turborepo"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "affected"
path = "src/lib.rs"

[[bin]]
name = "affected"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
